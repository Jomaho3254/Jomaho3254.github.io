<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How to Sell Without Selling</title>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Body Styling */
        body {
            background-color: #fcf7f2;
            color: #4a4a4a;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container Styling */
        .container {
            max-width: 800px;
            width: 100%;
            padding: 20px;
            text-align: center;
        }

        /* Header Section */
        .header {
            margin-bottom: 50px;
        }

        .book-icon {
            color: #ff6d33;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: bold;
            color: #333333;
            margin-bottom: 15px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #5c3e2e;
            margin-bottom: 30px;
        }

        /* Image Section */
        .image-container {
            max-width: 300px;
            margin: 0 auto 40px;
        }

        .image-container img {
            width: 100%;
            height: auto;
            border-radius: 10px; /* Optional styling for rounded corners */
        }

        /* Features Section */
        .features {
            max-width: 450px;
            margin: 0 auto 40px;
            text-align: left;
        }

        .feature-item {
            display: flex;
            align-items: baseline;
            margin-bottom: 20px;
        }

        .feature-item svg {
            min-width: 20px;
            margin-right: 10px;
            color: #b18c6d; /* Icon color */
        }

        /* Call-to-Action Button */
        .cta-button {
            display: inline-block;
            background-color: #ff6d33; /* Button color */
            color: white; /* Text color */
            font-weight: bold; 
            padding: 15px 40px; 
            border-radius: 50px; 
            text-decoration: none; 
            border: none; 
            cursor: pointer; 
            font-size: 1.1rem; 
            transition: transform 0.3s ease, box-shadow 0.3s ease; 
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(255, 109, 51, 0.3);
        }
    </style>
</head>
