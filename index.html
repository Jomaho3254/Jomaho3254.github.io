<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How to Sell Without Selling</title>
    <!-- Import Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body Styling */
        body {
            background-color: #ffffff; /* White Background */
            color: #4a4a4a;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Playfair Display', serif; /* Apply the Rome-like font */
        }

        /* Container Styling */
        .container {
            max-width: 800px;
            width: 100%;
            text-align: center; /* Center Content */
        }

        /* Header Section */
        .header {
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: bold;
            color: #333333;
            margin-bottom: 15px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #5c3e2e;
            margin-bottom: 30px;
        }

        /* Image Section */
        .image-container {
            max-width: 300px;
            margin: 0 auto 30px; /* Center Image */
        }

        .image-container img {
            width: 100%;
            height: auto;
            border-radius: 10px; /* Optional styling for rounded corners */
        }

        /* Features Section */
        .features {
            max-width: 450px;
            margin: 0 auto; /* Center Features */
        }

        .feature-item {
            display: block; /* Stack items vertically */
            font-size: 1.2rem; /* Slightly larger text */
            margin-bottom: 20px; /* Space between items */
        }

        /* Call-to-Action Button */
        .cta-button {
            display: inline-block;
            background-color: #505764; /* Button matches cat's main color */
            color: white; /* Text color */
            font-weight: bold; 
            padding: 15px 40px; 
            border-radius: 50px; 
            text-decoration: none; 
            border: none; 
            cursor: pointer; 
            font-size: 1.1rem; 
            transition: transform 0.3s ease, box-shadow 0.3s ease; 
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(80, 87, 100, 0.3); /* Slight shadow effect */
        }
    </style>
</head>
<body>
    <!-- Main Container -->
    <div class="container">
        
        <!-- Header Section -->
        <div class="header">
           <!-- Title -->
           <h1>How to Sell Without Selling</h1>

           <!-- Subtitle -->
           <p class="subtitle">Master the art of effortless selling through authentic connections</p>
        
       </div>

       <!-- Image Section -->
       <div class="image-container">
           <!-- Replace this URL with your GitHub raw image URL -->
           <img src="https://github.com/user-attachments/assets/4522c45c-7410-429c-84ed-8dd6368416b9" alt="Relaxed Cat">
       </div>

       <!-- Features Section -->
       <div class="features">
           <div class="feature-item">Learn natural selling techniques</div>
           <div class="feature-item">Build lasting customer relationships</div>
           <div class="feature-item">Increase sales without pressure</div>
       </div>

       <!-- Call-to-Action Button -->
       <button class="cta-button">BUY NOW</button>

    </div>
</body>
</html>
